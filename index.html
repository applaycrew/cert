<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Certified AI Practitioner (AIF-C01 Korean Version)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            align-items: flex-start;
        }
        /* 컨테이너 공통 스타일 */
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            margin-top: 30px;
        }

        /* --- 시작(Start) 페이지 스타일 --- */
        #start-page {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }
        #start-page h1 {
            color: #232f3e;
            margin-bottom: 10px;
            font-size: 2em;
        }
        #start-page .subtitle {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .date-input {
            font-size: 1em;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px 5px;
            width: 90px;
            text-align: center;
            font-family: inherit;
            background-color: #fff;
        }
        .date-input:focus {
            outline: none;
            border-color: #007bff;
        }
        #start-page .version-info {
            background-color: #f0f0f0;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 40px;
            color: #333;
            font-weight: bold;
        }
        .start-btn {
            background-color: #ff9900;
            color: white;
            font-size: 1.04em; 
            font-weight: bold;
            padding: 12px 32px; 
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, transform 0.1s;
        }
        .start-btn:hover {
            background-color: #e88b00;
        }
        .start-btn:active {
            transform: scale(0.98);
        }

        /* --- 문제 풀이(Quiz) 페이지 스타일 --- */
        #quiz-page {
            display: none; 
        }
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .progress-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .progress {
            font-size: 1em;
            color: #555;
            font-weight: bold;
        }
        .jump-container {
            display: flex;
            gap: 5px;
        }
        .jump-container input {
            width: 81px;
            padding: 4.5px;
            font-size: 0.9em;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .jump-container button {
            padding: 5px 10px; 
            font-size: 0.85em; 
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .jump-container button:hover {
            background-color: #5a6268;
        }
        
        /* 하단 컨트롤 영역 (양쪽 정렬) */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .review-btn {
            padding: 8px 16px; 
            font-size: 0.8em; 
            background-color: #17a2b8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .review-btn:hover {
            background-color: #138496;
        }

        h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.2em;
            line-height: 1.5;
        }
        .instruction {
            color: #007bff;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options {
            margin-top: 20px;
        }
        .option-label {
            display: block;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .option-label:hover {
            background-color: #e9ecef;
        }
        .option-label input {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .quiz-btn {
            padding: 8px 16px; 
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 0.8em; 
            cursor: pointer;
            font-weight: bold;
        }
        .quiz-btn:hover {
            background-color: #0056b3;
        }
        .quiz-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #prev-btn, #next-btn {
            padding: 4px 8px;
        }
        
        #submit-btn-wrapper {
            margin-left: auto; 
        }
        #submit-btn {
            background-color: #28a745;
        }
        #submit-btn:hover {
            background-color: #218838;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            line-height: 1.6;
            width: 100%;
            box-sizing: border-box;
        }
        .correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .explanation {
            margin-top: 10px;
            font-size: 0.95em;
        }

        /* --- 문제 풀이 결과(Review) 페이지 스타일 --- */
        #review-page {
            display: none;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .review-header h2 {
            margin: 0;
            color: #232f3e;
        }
        
        /* 통계/범례 영역 정렬 문제 해결을 위해 grid 레이아웃 사용 */
        .review-legend {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 모바일 대응: 무조건 2열 배치 */
            gap: 15px 10px; /* 위아래 15px, 양옆 10px 간격 */
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #333;
            font-weight: bold;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e9ecef;
            align-items: center;
        }
        /* PC 환경 등 화면이 넓을 때 4열로 한 줄에 표시 */
        @media (min-width: 500px) {
            .review-legend {
                grid-template-columns: repeat(4, auto);
                justify-content: center;
            }
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap; /* 글씨 줄바꿈 방지 */
        }
        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        .legend-unsolved { background-color: #f9f9f9; }
        .legend-correct { background-color: #d4edda; border-color: #c3e6cb; }
        .legend-incorrect { background-color: #f8d7da; border-color: #f5c6cb; }
        
        .review-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 7px;
            max-height: 450px;
            overflow-y: auto;
            padding-top: 2px;
            padding-right: 5px;
        }
        .review-item {
            padding: 7px 3px;
            font-size: 0.85em;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ccc;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .review-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .review-item.unsolved { background-color: #f9f9f9; color: #333; }
        .review-item.correct { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .review-item.incorrect { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
    </style>
</head>
<body>

<!-- 시작(Start) 페이지 -->
<div class="container" id="start-page">
    <div class="version-info">Get your IT certification easily and conveniently!</div>
    <h1>AWS Certified AI Practitioner</h1>
    <div class="subtitle">
        Exam: AIF-C01-KR (Korean Version)<br>
        Number of questions: <span id="start-total-q"></span><br>
        Vendor: Amazon<br>
        Date: 09/2026
    </div>
    <button class="start-btn" onclick="startQuiz()">Start 🚀</button>
</div>

<!-- 문제 풀이(Quiz) 페이지 -->
<div class="container" id="quiz-page">
    <div class="top-controls">
        <button class="quiz-btn" id="prev-btn" onclick="prevQuestion()" disabled>prev</button>
        
        <div class="progress-wrapper">
            <div class="progress" id="progress-text"></div>
            <div class="jump-container">
                <input type="number" id="jump-input" placeholder="문제번호" min="1" onkeypress="handleEnter(event)">
                <button onclick="jumpToQuestion()">이동</button>
            </div>
        </div>

        <button class="quiz-btn" id="next-btn" onclick="nextQuestion()">next</button>
    </div>

    <div id="question-number" style="color: #666; margin-bottom: 5px; font-weight: bold;"></div>
    <div class="instruction" id="question-instruction"></div>
    <h2 id="question-text">문제 로딩 중...</h2>
    
    <div class="options" id="options-container">
        <!-- 옵션 동적 추가 -->
    </div>

    <!-- 피드백(해설) 영역 -->
    <div class="feedback" id="feedback-container">
        <strong id="feedback-title"></strong>
        <div class="explanation" id="feedback-explanation"></div>
    </div>

    <!-- 하단 컨트롤 -->
    <div class="bottom-controls">
        <button class="review-btn" onclick="showReviewPage()">📊 문제 풀이 결과</button>
        <div id="submit-btn-wrapper">
            <button class="quiz-btn" id="submit-btn" onclick="checkAnswer()">정답 확인 ✔</button>
        </div>
    </div>
</div>

<!-- 문제 풀이 결과(Review) 페이지 -->
<div class="container" id="review-page">
    <div class="review-header">
        <h2>문제 풀이 결과</h2>
        <button class="quiz-btn" onclick="hideReviewPage()">돌아가기 ↩</button>
    </div>
    
    <!-- 숫자와 글자가 하나의 요소 안에 위치하여 높이(baseline) 정렬이 완벽하게 맞도록 수정된 범례 영역 -->
    <div class="review-legend">
        <div class="legend-item">
            <span>총 문항수: <span id="stat-total" style="color:#007bff; margin-left: 2px;">0</span></span>
        </div>
        <div class="legend-item">
            <div class="legend-box legend-correct"></div> 
            <span>정답: <span id="stat-correct" style="color:#155724; margin-left: 2px;">0</span></span>
        </div>
        <div class="legend-item">
            <div class="legend-box legend-incorrect"></div> 
            <span>오답: <span id="stat-incorrect" style="color:#721c24; margin-left: 2px;">0</span></span>
        </div>
        <div class="legend-item">
            <div class="legend-box legend-unsolved"></div> 
            <span>미풀이: <span id="stat-unsolved" style="color:#555; margin-left: 2px;">0</span></span>
        </div>
    </div>

    <div class="review-grid" id="review-grid">
        <!-- 그리드 아이템 동적 추가 -->
    </div>
</div>

<script>
    // 기존에 만들어둔 전체 문제 객체를 여기에 모두 붙여넣으세요.
    const questions = [
        {
            id: 1,
            question: "한 회사가 레이블이 지정되지 않은 대량의 데이터를 보유하고 있습니다. 이 회사는 특징 유사성을 기준으로 데이터를 그룹화하려고 합니다. 어떤 알고리즘이 이 요구 사항을 충족할까요?",
            options: [
                { id: "A", text: "XGBoost" },
                { id: "B", text: "K-평균" },
                { id: "C", text: "DeepAR 예측" },
                { id: "D", text: "선형 학습기" }
            ],
            answer: "B",
            explanation: "K-평균(K-means)은 레이블이 지정되지 않은 데이터를 특징 유사성과 거리 측정 기준에 따라 클러스터로 그룹화하는 데 사용되는 비지도 학습 알고리즘입니다."
        },
		{
            id: 2,
            question: "기초 모델(FM)을 미세조정하는 이점은 무엇입니까?",
            options: [
                { id: "A", text: "미세 조정을 통해 FM의 크기와 복잡성을 줄이고 추론 속도를 높일 수 있습니다." },
                { id: "B", text: "미세 조정은 특정 교육 데이터를 사용하여 FM을 처음부터 다시 교육하여 특정 사용 사례에 적응시킵니다." },
                { id: "C", text: "미세 조정은 FM을 최신 데이터로 사전 훈련시켜 FM의 지식을 최신 상태로 유지합니다." },
                { id: "D", text: "미세 조정은 새로운 레이블이 지정된 데이터에 대해 FM을 추가로 학습시켜 특정 작업에 대한 FM의 성능을 개선합니다." }
            ],
            answer: "D",
            explanation: "기초 모델을 미세 조정한다는 것은 사전 학습된 대규모 모델을 가져와 특정 사용 사례에 특화하기 위해 도메인별 또는 작업별 데이터에 대한 학습을 계속하는 것을 의미합니다. 처음부터 다시 학습하는 것이 아니라 의도한 애플리케이션에 대한 모델 정확도, 관련성 및 컨텍스트 적응성을 개선합니다."
        },
        {
            id: 3,
            question: "ML 모델에서 과도한 필터링(과적합)이 발생하는 이유는 무엇입니까?",
            options: [
                { id: "A", text: "학습 데이터 세트는 가능한 모든 입력 값을 반영하지 않습니다." },
                { id: "B", text: "이 모델에는 정규화 방법이 포함되어 있습니다." },
                { id: "C", text: "조기 종료 기준 때문에 모델 학습이 조기에 종료됩니다." },
                { id: "D", text: "학습 데이터 세트에 너무 많은 기능이 포함되어 있습니다." }
            ],
            answer: "A",
            explanation: "과적합(Overfitting)은 모델이 훈련 데이터의 노이즈와 패턴을 너무 잘 학습하여 새로운 데이터에 일반화되지 않을 때 발생합니다. 주요 원인 중 하나는 훈련 데이터 세트가 가능한 모든 입력 값을 대표하지 못하여 제한된 데이터에 모델이 과도하게 특화되는 경우입니다."
        },
        {
            id: 4,
            question: "한 회사가 시각 장애가 있는 사용자를 위한 모바일 앱을 개발하고 있습니다. 이 앱은 사용자의 말을 듣고 음성으로 응답할 수 있어야 합니다. 어떤 솔루션이 이러한 요구 사항을 충족시킬까요?",
            options: [
                { id: "A", text: "딥러닝 신경망을 사용하여 음성 인식을 수행합니다." },
                { id: "B", text: "숫자 데이터에서 패턴을 검색하는 ML 모델을 구축합니다." },
                { id: "C", text: "생성적 AI 요약을 사용하여 인간과 유사한 텍스트를 생성합니다." },
                { id: "D", text: "이미지 분류 및 인식을 위한 맞춤형 모델을 구축합니다." }
            ],
            answer: "A",
            explanation: "앱이 사용자의 말을 듣고 음성으로 응답하려면 음성을 텍스트로 변환(음성 인식)하고 텍스트를 음성으로 변환하는 기능이 필요합니다. 딥러닝 신경망은 음성 언어를 효과적으로 처리하고 기록할 수 있어 음성 인식 작업에 널리 사용됩니다."
        },
        {
            id: 5,
            question: "어떤 시나리오가 머신러닝 모델이 과적합되었음을 나타낼까요?",
            options: [
                { id: "A", text: "주식 예측 모델은 새로운 데이터로 테스트한 후 정확도가 떨어집니다." },
                { id: "B", text: "대출 부도 위험 모델은 위험을 평가하기 위해 신용 점수만 사용합니다." },
                { id: "C", text: "매출 예측 모델은 연간 매출을 예측하기 위해 한 달치 데이터만 사용합니다." },
                { id: "D", text: "학생 성과 모델은 학생이 수강한 고급 수업 수만을 사용하여 성과를 평가합니다." }
            ],
            answer: "A",
            explanation: "과적합은 모델이 훈련 데이터의 노이즈를 포함한 패턴을 너무 가깝게 학습하여 보이지 않는 새로운 데이터에 일반화하지 못할 때 발생합니다. 모델이 훈련 중에는 우수한 성능을 보이지만 새로운 데이터나 테스트 데이터로 평가할 때 정확도가 떨어지는 것은 과적합의 교과서적인 증상입니다."
        },
        {
            id: 6,
            question: "ML 연구팀에서는 맞춤형 ML 모델을 개발합니다. 모델 아티팩트는 다른 팀과 공유되어 제품 및 서비스에 통합됩니다. ML 팀은 모델 학습 코드와 데이터를 보관합니다. ML 팀은 ML 팀이 모델을 감사하는 데 사용할 수 있는 메커니즘을 구축하고자 합니다. ML 팀은 사용자 정의 ML 모델을 게시할 때 어떤 솔루션을 사용해야 합니까?",
            options: [
                { id: "A", text: "관련 정보를 포함하는 문서를 생성합니다. 문서를 Amazon S3에 저장합니다." },
                { id: "B", text: "투명성과 모델 이해를 위해 AWS AI 서비스 카드를 사용하세요." },
                { id: "C", text: "의도된 사용, 훈련 및 추론 세부 정보를 포함하여 Amazon SageMaker 모델 카드를 만듭니다." },
                { id: "D", text: "모델 학습 스크립트를 생성합니다. 모델 학습 스크립트를 Git 저장소에 커밋합니다." }

        {

            question: "회사는 Amazon Bedrock API에 대한 모든 요청을 기록해야 합니다. 회사는 로그를 최소 비용으로 5년 동안 안전하게 보관해야 합니다. 이러한 요구 사항을 충족하는 AWS 서비스와 스토리지 클래스의 어떤 조합이 있습니까? (2개 선택)",

    // 시작 페이지에 총 문항 수 동적 표시
    document.getElementById('start-total-q').innerText = questions.length;

    let currentQuestionIndex = 0;

    // 시작 버튼 클릭 시 호출
    function startQuiz() {
        document.getElementById('start-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        loadQuestion();
    }

    // 문제 로드 함수
    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        const isMultiple = Array.isArray(q.answer);
        
        document.getElementById('progress-text').innerText = `문제 ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('question-number').innerText = `QUESTION NO: ${q.id}`;
        
        const instructionEl = document.getElementById('question-instruction');
        if (isMultiple) {
            instructionEl.innerText = `💡 ${q.answer.length}개의 정답을 선택하세요.`;
            instructionEl.style.display = 'block';
        } else {
            instructionEl.style.display = 'none';
        }

        document.getElementById('question-text').innerText = q.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        const inputType = isMultiple ? 'checkbox' : 'radio';

        q.options.forEach(opt => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.innerHTML = `<input type="${inputType}" name="option" value="${opt.id}"> <strong>${opt.id}.</strong> ${opt.text}`;
            optionsContainer.appendChild(label);
        });

        const submitBtn = document.getElementById('submit-btn');
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackExplanation = document.getElementById('feedback-explanation');
        
        if (q.status) {
            const inputs = document.querySelectorAll('input[name="option"]');
            inputs.forEach(input => {
                if (isMultiple) {
                    if (q.userSelection.includes(input.value)) input.checked = true;
                } else {
                    if (q.userSelection === input.value) input.checked = true;
                }
                input.disabled = true;
            });

            submitBtn.style.display = 'none';
            feedbackContainer.style.display = 'block';

            let correctAnswerText = isMultiple ? [...q.answer].sort().join(", ") : q.answer;
            feedbackExplanation.innerHTML = `<strong>정답: ${correctAnswerText}</strong><br><br>${q.explanation}`;

            if (q.status === 'correct') {
                feedbackContainer.className = 'feedback correct';
                feedbackTitle.innerText = '정답입니다! 🎉';
            } else {
                feedbackContainer.className = 'feedback incorrect';
                feedbackTitle.innerText = '오답입니다. ❌';
            }
        } else {
            submitBtn.style.display = 'block';
            feedbackContainer.style.display = 'none';
        }

        document.getElementById('jump-input').value = '';
        document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;
        document.getElementById('next-btn').disabled = currentQuestionIndex === questions.length - 1;
    }

    // 정답 확인 함수
    function checkAnswer() {
        const q = questions[currentQuestionIndex];
        const isMultiple = Array.isArray(q.answer);
        
        let isCorrect = false;
        let correctAnswerText = "";

        if (isMultiple) {
            const selectedNodes = document.querySelectorAll('input[name="option"]:checked');
            const selectedValues = Array.from(selectedNodes).map(el => el.value).sort();
            
            if (selectedValues.length === 0) {
                alert('하나 이상의 답을 선택해주세요!');
                return;
            }
            
            const sortedAnswer = [...q.answer].sort();
            isCorrect = JSON.stringify(selectedValues) === JSON.stringify(sortedAnswer);
            correctAnswerText = sortedAnswer.join(", ");
            q.userSelection = selectedValues;
        } else {
            const selected = document.querySelector('input[name="option"]:checked');
            if (!selected) {
                alert('답을 선택해주세요!');
                return;
            }
            isCorrect = selected.value === q.answer;
            correctAnswerText = q.answer;
            q.userSelection = selected.value;
        }

        q.status = isCorrect ? 'correct' : 'incorrect';

        const inputs = document.querySelectorAll('input[name="option"]');
        inputs.forEach(input => input.disabled = true);

        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackExplanation = document.getElementById('feedback-explanation');

        feedbackContainer.style.display = 'block';
        feedbackExplanation.innerHTML = `<strong>정답: ${correctAnswerText}</strong><br><br>${q.explanation}`;

        if (isCorrect) {
            feedbackContainer.className = 'feedback correct';
            feedbackTitle.innerText = '정답입니다! 🎉';
        } else {
            feedbackContainer.className = 'feedback incorrect';
            feedbackTitle.innerText = '오답입니다. ❌';
        }
        
        document.getElementById('submit-btn').style.display = 'none';
    }

    function nextQuestion() {
        if (currentQuestionIndex < questions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            loadQuestion();
        }
    }

    function jumpToQuestion() {
        const targetId = parseInt(document.getElementById('jump-input').value);
        if (isNaN(targetId)) {
            alert("이동할 문제 번호를 입력해주세요.");
            return;
        }

        const targetIndex = questions.findIndex(q => q.id === targetId);
        
        if (targetIndex !== -1) {
            currentQuestionIndex = targetIndex;
            loadQuestion();
        } else {
            alert(`입력하신 ${targetId}번 문제는 존재하지 않습니다.`);
        }
    }

    function handleEnter(event) {
        if (event.key === 'Enter') {
            jumpToQuestion();
        }
    }

    // --- 문제 풀이 결과(Review) 페이지 관련 함수 --- //
    
    function showReviewPage() {
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('review-page').style.display = 'block';
        
        const reviewGrid = document.getElementById('review-grid');
        reviewGrid.innerHTML = ''; 

        let correctCount = 0;
        let incorrectCount = 0;
        let unsolvedCount = 0;

        questions.forEach((q, index) => {
            // 통계 계산
            if (q.status === 'correct') {
                correctCount++;
            } else if (q.status === 'incorrect') {
                incorrectCount++;
            } else {
                unsolvedCount++;
            }

            // 그리드 아이템 렌더링
            const item = document.createElement('div');
            item.className = `review-item ${q.status || 'unsolved'}`;
            item.innerText = q.id; 
            
            item.onclick = () => {
                goToQuestionFromReview(index);
            };
            reviewGrid.appendChild(item);
        });

        // 통계 텍스트 업데이트
        const totalCount = questions.length;
        document.getElementById('stat-total').innerText = totalCount;
        document.getElementById('stat-correct').innerText = correctCount;
        document.getElementById('stat-incorrect').innerText = incorrectCount;
        document.getElementById('stat-unsolved').innerText = unsolvedCount;
    }

    function hideReviewPage() {
        document.getElementById('review-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
    }

    function goToQuestionFromReview(index) {
        currentQuestionIndex = index;
        hideReviewPage();
        loadQuestion();
    }

</script>
